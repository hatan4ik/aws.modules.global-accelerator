name: Bug report
description: A resource, validation, or output behaves differently from what the module documents.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Redact account IDs, ARNs, and secrets before pasting configuration or output.
  - type: input
    id: module-version
    attributes:
      label: Module version or commit
      description: The tag or commit SHA pinned in your module `source` / `ref`.
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: terraform-version
    attributes:
      label: Terraform version
      description: Output of `terraform version`.
      placeholder: 1.7.5
    validations:
      required: true
  - type: input
    id: provider-version
    attributes:
      label: AWS provider version
      description: The `hashicorp/aws` version recorded in your `.terraform.lock.hcl`.
      placeholder: 6.66.0
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - accelerator (accelerator.tf, locals.tf)
        - listeners (listeners.tf)
        - endpoint groups (endpoint_groups.tf)
        - advisory checks (checks.tf)
        - examples
        - integration suites
        - not sure
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest module call that reproduces the problem.
      render: hcl
      placeholder: |
        module "global_accelerator" {
          source = "git::https://github.com/hatan4ik/aws.modules.global-accelerator.git?ref=v1.0.0"

          name = "public-api"

          listeners = {
            primary = {
              port_ranges = [{ from_port = 443, to_port = 443 }]
            }
          }

          endpoint_groups = {
            "us-east-1" = {
              listener_key = "primary"
              endpoint_configurations = [
                { endpoint_id = "arn:aws:elasticloadbalancing:us-east-1:123456789012:loadbalancer/app/primary/50dc6c495c0c9188" }
              ]
            }
          }
        }
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Plan or apply output
      description: Relevant `terraform plan` or `terraform apply` output, with ARNs and account IDs redacted.
      render: shell
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I redacted ARNs, account IDs, and secrets from everything above.
          required: true
        - label: I searched existing issues for this problem.
          required: true
